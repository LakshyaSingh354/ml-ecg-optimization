[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-bench"
version = "0.1.0"
description = "Reproducible benchmarks for optimizing medical AI models on device"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
benchmark = [
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "scikit-learn>=1.4",
    "wfdb>=4.1",
]
dev = ["pytest>=8.0"]

[project.scripts]
edge-ai-bench = "edge_ai_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires optional ONNX Runtime dependencies",
]
